<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border-radius: 0.5rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-sky-400">🏆 Hall of Fame</h1>
            <a href="/" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded transition">Back to Gym</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Push-up Leaderboard -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4 text-emerald-400">Push-up Top Players</h2>
                <canvas id="pushupChart"></canvas>
            </div>

            <!-- Squat Leaderboard -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4 text-amber-400">Squat Top Players</h2>
                <canvas id="squatChart"></canvas>
            </div>

            <!-- Jump Leaderboard -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4 text-rose-400">Jump Top Players</h2>
                <canvas id="jumpChart"></canvas>
            </div>

            <!-- Jumping Jack Leaderboard -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4 text-purple-400">Jumping Jack Top Players</h2>
                <canvas id="jumpingJackChart"></canvas>
            </div>

            <!-- Lunge Leaderboard -->
            <div class="card">
                <h2 class="text-xl font-semibold mb-4 text-orange-400">Lunge Top Players</h2>
                <canvas id="lungeChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Data passed from Flask
        const leaderboardData = {{ leaderboard | tojson }};

        function createChart(canvasId, label, data, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            // Sort by score descending and take top 5
            const sortedData = data.sort((a, b) => b.score - a.score).slice(0, 5);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedData.map(d => d.name),
                    datasets: [{
                        label: label,
                        data: sortedData.map(d => d.score),
                        backgroundColor: color,
                        borderColor: color,
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    scales: {
                        x: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { color: '#e2e8f0' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        createChart('pushupChart', 'Push-ups', leaderboardData.pushup || [], '#34d399');
        createChart('squatChart', 'Squats', leaderboardData.squat || [], '#fbbf24');
        createChart('jumpChart', 'Jumps', leaderboardData.jump || [], '#fb7185');
        createChart('jumpingJackChart', 'Jumping Jacks', leaderboardData.jumping_jack || [], '#c084fc');
        createChart('lungeChart', 'Lunges', leaderboardData.lunge || [], '#fb923c');
    </script>
</body>
</html>
