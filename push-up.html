<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Push-up Animation</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* Let container background show through */
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="skeleton-canvas"></canvas>

    <script>
    const canvas = document.getElementById('skeleton-canvas');
    const ctx = canvas.getContext('2d');

    const abstractFloorY = 300 * 0.85;

    const upPose = {
        nose: { x: 280, y: 100 },
        shoulder: { x: 260, y: 110 },
        elbow: { x: 260, y: 160 },
        wrist: { x: 260, y: abstractFloorY },
        hip: { x: 180, y: 150 },
        knee: { x: 100, y: 190 },
        ankle: { x: 50, y: abstractFloorY }
    };

    const downPose = {
        nose: { x: 280, y: 200 },
        shoulder: { x: 260, y: 210 },
        elbow: { x: 210, y: 200 },
        wrist: { x: 260, y: abstractFloorY },
        hip: { x: 180, y: 225 },
        knee: { x: 100, y: 230 },
        ankle: { x: 50, y: abstractFloorY }
    };

    function resize() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        if (canvas.width !== rect.width * dpr || canvas.height !== rect.height * dpr) {
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
        }
        return { width: rect.width, height: rect.height };
    }

    function drawBone(p1, p2, scale) {
        ctx.beginPath();
        ctx.moveTo(p1.x * scale.x, p1.y * scale.y);
        ctx.lineTo(p2.x * scale.x, p2.y * scale.y);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function drawJoint(p, scale) {
        ctx.beginPath();
        ctx.arc(p.x * scale.x, p.y * scale.y, 6, 0, 2 * Math.PI);
        ctx.fillStyle = '#fbbf24';
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(251, 191, 36, 0.5)';
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    function drawFloor(width, height) {
        const floorY = height * 0.85;
        
        // Grid floor
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;
        
        // Horizontal lines
        for (let i = 0; i < 5; i++) {
            const y = floorY + (i * 15);
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }
        
        // Perspective lines
        const centerX = width / 2;
        for (let i = -5; i <= 5; i++) {
            const x = centerX + (i * 40);
            ctx.moveTo(x, floorY);
            ctx.lineTo(x + (i * 20), height);
        }
        ctx.stroke();

        // Main floor line
        ctx.beginPath();
        ctx.moveTo(0, floorY);
        ctx.lineTo(width, floorY);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(56, 189, 248, 0.3)';
        ctx.stroke();
        ctx.shadowBlur = 0;
    }

    function lerp(a, b, t) {
        return a + (b - a) * t;
    }

    const startTime = Date.now();
    const animationDuration = 2000;

    function animate() {
        const dims = resize();
        const { width, height } = dims;

        ctx.clearRect(0, 0, width, height);

        const elapsed = Date.now() - startTime;
        const progress = (elapsed % animationDuration) / animationDuration;
        let t = progress * 2;
        if (t > 1) {
            t = 2 - t;
        }

        // Ease in-out
        t = t < .5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

        const currentPose = {};
        for (const joint in upPose) {
            currentPose[joint] = {
                x: lerp(upPose[joint].x, downPose[joint].x, t),
                y: lerp(upPose[joint].y, downPose[joint].y, t)
            };
        }

        const scale = {
            x: width / 350,
            y: height / 300
        };

        drawFloor(width, height);
        drawBone(currentPose.nose, currentPose.shoulder, scale);
        drawBone(currentPose.shoulder, currentPose.elbow, scale);
        drawBone(currentPose.elbow, currentPose.wrist, scale);
        drawBone(currentPose.shoulder, currentPose.hip, scale);
        drawBone(currentPose.hip, currentPose.knee, scale);
        drawBone(currentPose.knee, currentPose.ankle, scale);

        for (const joint in currentPose) {
            drawJoint(currentPose[joint], scale);
        }

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    animate();
    </script>
</body>
</html>
